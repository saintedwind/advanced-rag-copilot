name: Evidence desk validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/live_check.py
      - run: python -c "import json; r=json.load(open('reports/live-extractive.json')); assert r['passed']==r['total'] and r['cache_verified'], 'Live retrieval regression'"
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-validation
          path: reports/
