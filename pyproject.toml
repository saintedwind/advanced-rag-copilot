[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-rag-copilot"
version = "1.0.0"
description = "Production-grade Self-Corrective Hybrid RAG copilot with LangGraph, Qdrant, FlashRank and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Engineering Portfolio", email = "portfolio@example.com" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "langchain>=0.2.6",
    "langchain-core>=0.2.10",
    "langchain-community>=0.2.6",
    "langchain-openai>=0.1.13",
    "langgraph>=0.1.4",
    "qdrant-client>=1.9.1",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.8",
    "tiktoken>=0.7.0",
    "ragas>=0.1.9",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
