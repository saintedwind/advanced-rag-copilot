[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-rag-copilot"
version = "0.3.0"
description = "Local evidence retrieval desk with persistent hybrid search and bounded source selection"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Peyman Gholamhosseini"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.app" = ["index.html"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
rerank = ["flashrank>=0.2,<1", "langchain-community>=0.3,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
